name: Sync publications and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # every Monday 03:00 UTC (12:00 KST)
  workflow_dispatch:       # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Sync only on schedule / manual run, so ordinary pushes don't spend SerpAPI quota
      - name: Sync publications
        id: sync
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          pip install --quiet requests
          python scripts/fetch_publications.py

      - name: Commit updated data
        if: github.event_name != 'push' && steps.sync.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json
          git diff --staged --quiet || (git commit -m "Sync publications [skip ci]" && git push)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
